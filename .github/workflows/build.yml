name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SonyRemote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SonyRemote-apk
          path: SonyRemote.apk

      # Rolling release so the phone can always download the newest APK from one stable link:
      # https://github.com/<owner>/<repo>/releases/latest/download/SonyRemote.apk
      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: SonyRemote (latest build)
          body: Latest build from `main` (${{ github.sha }}). Debug-signed APK, install it directly on the phone.
          artifacts: SonyRemote.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          commit: ${{ github.sha }}
